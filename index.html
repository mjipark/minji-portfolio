  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>/* Lifted verbatim from mjipark/minji-portfolio styles.css —\n   only the rules the gradient-mesh engine's own markup needs\n   (the canvas + the floating control widget it injects). */\n:root {\n  --cream: #faf3e0;\n  --panel: rgba(255, 255, 255, 0.45);\n  --panel-line: rgba(255, 255, 255, 0.7);\n  --glass-bg: rgba(255, 255, 255, 0.60);\n  --glass-border: rgba(255, 255, 255, 0.85);\n  --glass-shadow: 0 8px 32px 0 rgba(42, 36, 32, 0.08);\n  --ink: #201a18;\n  --ink-soft: #4d433b;\n  --taupe: #7d6e5d;\n  --orange: #e07248;\n  --orange-deep: #b84c24;\n  --orange-soft: #f4be9b;\n  --line: rgba(210, 190, 170, 0.35);\n}\n\n#gradient-mesh-canvas {\n  position: fixed;\n  top: 0;\n  left: 0;\n  width: 100vw;\n  height: 100vh;\n  z-index: 0;\n  pointer-events: none;\n  display: block;\n}\n\n::selection {\n  background: var(--orange-soft);\n  color: var(--ink);\n}\n\n.mesh-widget {\n  position: fixed;\n  bottom: 28px;\n  right: 28px;\n  z-index: 990;\n  font-family: 'Inter', -apple-system, sans-serif;\n}\n\n.mesh-widget-trigger {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  background: rgba(255, 255, 255, 0.75);\n  backdrop-filter: blur(20px) saturate(180%);\n  -webkit-backdrop-filter: blur(20px) saturate(180%);\n  border: 1px solid rgba(255, 255, 255, 0.9);\n  padding: 12px 20px;\n  border-radius: 30px;\n  color: var(--ink);\n  font-family: 'IBM Plex Mono', monospace;\n  font-size: 13px;\n  font-weight: 500;\n  cursor: pointer;\n  box-shadow: 0 10px 30px rgba(42, 36, 32, 0.12), 0 2px 4px rgba(255, 255, 255, 0.9) inset;\n  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);\n}\n\n.mesh-widget-trigger:hover,\n.mesh-widget-trigger.active {\n  background: rgba(255, 255, 255, 0.95);\n  transform: translateY(-2px) scale(1.02);\n  box-shadow: 0 14px 36px rgba(184, 76, 36, 0.2);\n  border-color: var(--orange-soft);\n}\n\n.mesh-widget-trigger .widget-icon {\n  font-size: 15px;\n  animation: floatSparkle 3s ease-in-out infinite;\n}\n\n@keyframes floatSparkle {\n\n  0%,\n  100% {\n    transform: translateY(0) rotate(0deg);\n  }\n\n  50% {\n    transform: translateY(-2px) rotate(8deg);\n  }\n}\n\n.mesh-widget-content {\n  position: absolute;\n  bottom: 58px;\n  right: 0;\n  width: 320px;\n  background: rgba(255, 255, 255, 0.85);\n  backdrop-filter: blur(24px) saturate(200%);\n  -webkit-backdrop-filter: blur(24px) saturate(200%);\n  border: 1px solid rgba(255, 255, 255, 0.95);\n  border-radius: 20px;\n  padding: 22px;\n  box-shadow: 0 20px 48px rgba(32, 24, 20, 0.16), 0 2px 6px rgba(255, 255, 255, 0.8) inset;\n  transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.3s;\n  transform-origin: bottom right;\n}\n\n.mesh-widget-content.hidden {\n  opacity: 0;\n  transform: scale(0.90) translateY(16px);\n  pointer-events: none;\n  visibility: hidden;\n}\n\n.widget-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: flex-start;\n  margin-bottom: 16px;\n  padding-bottom: 12px;\n  border-bottom: 1px solid var(--line);\n}\n\n.widget-header h4 {\n  margin: 0;\n  font-family: 'Fraunces', serif;\n  font-size: 17px;\n  color: var(--ink);\n}\n\n.widget-header p {\n  margin: 2px 0 0;\n  font-size: 12px;\n  color: var(--ink-soft);\n}\n\n.widget-close-btn {\n  background: none;\n  border: none;\n  font-size: 22px;\n  color: var(--taupe);\n  cursor: pointer;\n  padding: 0 4px;\n  line-height: 1;\n  transition: color 0.15s ease;\n}\n\n.widget-close-btn:hover {\n  color: var(--orange-deep);\n}\n\n.widget-section {\n  margin-bottom: 16px;\n}\n\n.widget-label-title {\n  display: block;\n  font-family: 'IBM Plex Mono', monospace;\n  font-size: 11px;\n  text-transform: uppercase;\n  letter-spacing: 0.05em;\n  color: var(--taupe);\n  margin-bottom: 8px;\n}\n\n.palette-grid {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: 8px;\n}\n\n.palette-pill {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  background: rgba(255, 255, 255, 0.65);\n  border: 1px solid var(--panel-line);\n  padding: 8px 10px;\n  border-radius: 10px;\n  font-size: 12px;\n  font-family: 'Inter', sans-serif;\n  color: var(--ink);\n  cursor: pointer;\n  transition: all 0.2s ease;\n}\n\n.palette-pill:hover,\n.palette-pill.active {\n  background: rgba(255, 255, 255, 0.95);\n  border-color: var(--orange);\n  color: var(--orange-deep);\n  box-shadow: 0 4px 12px rgba(184, 76, 36, 0.12);\n  transform: translateY(-1px);\n}\n\n.palette-dot {\n  width: 14px;\n  height: 14px;\n  border-radius: 50%;\n  flex-shrink: 0;\n  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);\n}\n\n.slider-header {\n  display: flex;\n  justify-content: space-between;\n  font-size: 12px;\n  font-family: 'IBM Plex Mono', monospace;\n  color: var(--ink-soft);\n  margin-bottom: 6px;\n}\n\n#mesh-speed-slider {\n  width: 100%;\n  accent-color: var(--orange-deep);\n  cursor: pointer;\n}\n\n.row-flex {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n}\n\n.toggle-group {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  width: 100%;\n  font-size: 12.5px;\n  color: var(--ink-soft);\n}\n\n.toggle-group input[type=\"checkbox\"] {\n  accent-color: var(--orange-deep);\n  width: 16px;\n  height: 16px;\n  cursor: pointer;\n}\n\n.widget-footer {\n  margin-top: 16px;\n  padding-top: 12px;\n  border-top: 1px solid var(--line);\n}\n\n.widget-btn-primary {\n  width: 100%;\n  background: var(--ink);\n  color: var(--cream);\n  border: none;\n  padding: 10px 14px;\n  border-radius: 10px;\n  font-family: 'IBM Plex Mono', monospace;\n  font-size: 12.5px;\n  cursor: pointer;\n  transition: all 0.2s ease;\n}\n\n.widget-btn-primary:hover {\n  background: var(--orange-deep);\n}\n\n.widget-btn-primary.paused {\n  background: var(--orange-deep);\n}\n\n@media (max-width: 480px) {\n  .mesh-widget {\n    bottom: 16px;\n    right: 16px;\n  }\n\n  .mesh-widget-content {\n    width: calc(100vw - 32px);\n    right: 0;\n  }\n}\n<\u002Fstyle>\n  <style>/* Portfolio Home v3 (dark) — only what inline styles can't express. */\n\n.reveal {\n  opacity: 0;\n  transform: translateY(26px);\n  transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);\n}\n\n.reveal.in-view { opacity: 1; transform: none; }\n\n.reveal-d1 { transition-delay: 0.08s; }\n.reveal-d2 { transition-delay: 0.16s; }\n.reveal-d3 { transition-delay: 0.24s; }\n\n@keyframes heroRise {\n  from { opacity: 0; transform: translateY(22px); }\n  to { opacity: 1; transform: none; }\n}\n\n@keyframes scrollNudge {\n  0%, 100% { transform: translateY(0); opacity: 0.7; }\n  50% { transform: translateY(6px); opacity: 1; }\n}\n\n@keyframes glowPulse {\n  0%, 100% { opacity: 0.5; }\n  50% { opacity: 0.85; }\n}\n\n.hero-rise { animation: heroRise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; }\n.hero-rise-1 { animation-delay: 0.08s; }\n.hero-rise-2 { animation-delay: 0.20s; }\n.hero-rise-3 { animation-delay: 0.32s; }\n.hero-rise-4 { animation-delay: 0.44s; }\n.hero-rise-5 { animation-delay: 0.56s; }\n\n.scroll-cue { animation: scrollNudge 2.2s ease-in-out infinite; }\n.glow { animation: glowPulse 6s ease-in-out infinite; }\n\n/* experience disclosure */\n.xp-panel {\n  overflow: hidden;\n  max-height: 0;\n  opacity: 0;\n  transition: max-height 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, margin-top 0.3s ease;\n}\n\n.xp-item[data-open=\"true\"] .xp-panel { max-height: 1200px; opacity: 1; margin-top: 18px; }\n.xp-item[data-open=\"true\"] .xp-chevron { transform: rotate(90deg); }\n\n/* one full-page spine */\n.spine { position: relative; }\n.spine::before {\n  content: \"\";\n  position: absolute;\n  left: 45px; top: 0; bottom: 0;\n  width: 2px;\n  background: linear-gradient(180deg, rgba(244,190,155,0) 0%, rgba(244,190,155,0.6) 6%, rgba(200,180,226,0.45) 60%, rgba(244,190,155,0.5) 88%, rgba(244,190,155,0) 100%);\n}\n.spine-node { position: relative; }\n.spine-node::before {\n  content: \"\";\n  position: absolute;\n  left: -48px; top: 14px;\n  width: 12px; height: 12px;\n  border-radius: 50%;\n  background: #161110;\n  border: 2px solid #f4be9b;\n  box-shadow: 0 0 0 4px rgba(224,114,72,0.12);\n  transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.5s cubic-bezier(0.16,1,0.3,1);\n  transform: scale(0.6);\n}\n.spine-node.in-view::before { transform: scale(1); }\n.spine-head::before { top: 0.42em; width: 16px; height: 16px; left: -50px; border-color: #e07248; background: #e07248; box-shadow: 0 0 0 6px rgba(224,114,72,0.16); }\n.xp-item.spine-node::before { top: 30px; }\n.xp-item[data-open=\"true\"].spine-node::before { background: #e07248; box-shadow: 0 0 0 7px rgba(224,114,72,0.22); }\n\n/* pinned statement */\n#statement-pin { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; overflow: hidden; }\n.stmt-word { font-family: 'Roboto', sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: -0.04em; line-height: 0.86; will-change: transform, opacity; }\n.stmt-line { transition: opacity 0.4s ease, transform 0.4s ease; opacity: 0; transform: translateY(12px); position: absolute; }\n.stmt-line.on { opacity: 1; transform: none; }\n\n/* cube face tray */\n.cube-tray { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; width: 100%; }\n.cube-tray > div { aspect-ratio: 1; }\n\n.tl { position: relative; padding-left: 34px; }\n.tl::before {\n  content: \"\";\n  position: absolute;\n  left: 9px; top: 6px; bottom: 6px;\n  width: 2px;\n  background: linear-gradient(180deg, rgba(244,190,155,0.05), rgba(244,190,155,0.55) 12%, rgba(200,180,226,0.45) 70%, rgba(244,190,155,0.04));\n}\n.tl-node { position: relative; }\n.tl-node::before {\n  content: \"\";\n  position: absolute;\n  left: -30px; top: 30px;\n  width: 12px; height: 12px;\n  border-radius: 50%;\n  background: #161110;\n  border: 2px solid #f4be9b;\n  box-shadow: 0 0 0 4px rgba(224,114,72,0.12);\n  transition: background 0.3s ease, box-shadow 0.3s ease;\n}\n.tl-node[data-open=\"true\"]::before { background: #e07248; box-shadow: 0 0 0 7px rgba(224,114,72,0.2); }\n\n/* infinite marquee band */\n.marquee { display: flex; overflow: hidden; width: 100%; user-select: none; mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); }\n.marquee-track { display: flex; flex-shrink: 0; align-items: center; gap: 46px; padding-right: 46px; animation: marqueeSlide 34s linear infinite; }\n.marquee:hover .marquee-track { animation-play-state: paused; }\n.marquee-rev .marquee-track { animation-direction: reverse; animation-duration: 44s; }\n@keyframes marqueeSlide { from { transform: translateX(0); } to { transform: translateX(-100%); } }\n\n/* cube stage */\n#hero-3d canvas { pointer-events: none; }\n\n#float-nav { transition: background 0.3s ease, box-shadow 0.3s ease; }\n#float-nav.visible {\n  background: rgba(36, 29, 27, 0.86) !important;\n  box-shadow: 0 12px 34px rgba(0, 0, 0, 0.34) !important;\n}\n\n@media (min-width: 901px) {\n  #nav-launcher { display: none !important; }\n  #drawer { display: none !important; }\n}\n\n@media (max-width: 900px) {\n  #float-nav { display: none !important; }\n  #nav-launcher { display: flex !important; }\n\n  #drawer {\n    transform: translateX(-100%);\n    transition: transform 0.34s cubic-bezier(0.16, 1, 0.3, 1);\n  }\n\n  #drawer.open { transform: translateX(0); }\n\n  .hero-grid { grid-template-columns: 1fr !important; }\n  .hero-3d-wrap { height: 320px !important; }\n  .work-grid { grid-template-columns: 1fr !important; }\n  .skill-grid { grid-template-columns: 1fr !important; }\n  .footer-top { grid-template-columns: 1fr !important; }\n  .footer-bottom { flex-direction: column !important; align-items: flex-s dark scrim\n  startMesh(tries = 0) {\n    const Engine = window.GradientMesh;\n    if (!Engine) {\n      if (tries < 120) setTimeout(() => this.startMesh(tries + 1), 60);\n      return;\n    }\n    let canvas = document.getElementById('gradient-mesh-canvas');\n    if (!canvas) {\n      canvas = document.createElement('canvas');\n      canvas.id = 'gradient-mesh-canvas';\n      document.body.insertBefore(canvas, document.body.firstChild);\n    }\n    const old = document.getElementById('mesh-control-widget');\n    if (old) old.remove();\n    window.gradientMeshApp = new Engine();\n    const widget = document.getElementById('mesh-control-widget');\n    if (widget) widget.remove();\n  }\n\n  // ---- draggable cube ----\n  startCube(tries = 0) {\n    const host = document.getElementById('hero-3d');\n    if (!window.THREE || !host) {\n      if (tries < 150) setTimeout(() => this.startCube(tries + 1), 70);\n      return;\n    }\n    const THREE = window.THREE;\n    host.innerHTML = '';\n\n    const scene = new THREE.Scene();\n    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);\n    camera.position.set(0, 0, 6.4);\n\n    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });\n    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));\n    renderer.setClearColor(0x000000, 0);\n    host.appendChild(renderer.domElement);\n    Object.assign(renderer.domElement.style, { width: '100%', height: '100%', display: 'block' });\n\n    const group = new THREE.Group();\n    scene.add(group);\n\n    this.cubeMats = [];\n    for (let i = 0; i < 6; i++) {\n      this.cubeMats.push(new THREE.MeshStandardMaterial({\n        color: 0x2a2220, roughness: 0.42, metalness: 0.35,\n        transparent: true, opacity: 0.98\n      }));\n    }\n    const cube = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.2, 2.2), this.cubeMats);\n    group.add(cube);\n    this.watchCubeFaces();\n\n    const edges = new THREE.LineSegments(\n      new THREE.EdgesGeometry(cube.geometry),\n      new THREE.LineBasicMaterial({ color: 0xf4be9b, transparent: true, opacity: 0.9 })\n    );\n    group.add(edges);\n\n    const halo = new THREE.LineSegments(\n      new THREE.EdgesGeometry(new THREE.BoxGeometry(3.1, 3.1, 3.1)),\n      new THREE.LineBasicMaterial({ color: 0xc8b4e2, transparent: true, opacity: 0.28 })\n    );\n    group.add(halo);\n\n    const dustGeo = new THREE.BufferGeometry();\n    const N = 220, pos = new Float32Array(N * 3);\n    for (let i = 0; i < N; i++) {\n      const r = 3.2 + Math.random() * 2.4, t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);\n      pos[i * 3] = r * Math.sin(p) * Math.cos(t);\n      pos[i * 3 + 1] = r * Math.sin(p) * Math.sin(t) * 0.62;\n      pos[i * 3 + 2] = r * Math.cos(p);\n    }\n    dustGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));\n    const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xba95c7, size: 0.04, transparent: true, opacity: 0.55 }));\n    scene.add(dust);\n\n    scene.add(new THREE.AmbientLight(0x6b5a52, 0.9));\n    const key = new THREE.DirectionalLight(0xffc4a0, 1.5); key.position.set(3, 3.4, 4); scene.add(key);\n    const rim = new THREE.DirectionalLight(0xc8b4e2, 0.9); rim.position.set(-4, -1.5, -2); scene.add(rim);\n\n    const resize = () => {\n      const w = host.clientWidth || 1, h = host.clientHeight || 1;\n      renderer.setSize(w, h, false);\n      camera.aspect = w / h;\n      camera.updateProjectionMatrix();\n    };\n    resize();\n    this.onResize3D = resize;\n    window.addEventListener('resize', resize);\n\n    // the cube follows the cursor: pointer position tilts it, and it eases\n    // back to its resting pose when the pointer leaves the window\n    const rot = { x: -0.22, y: 0.55 };\n    const aim = { x: -0.22, y: 0.55 };\n    let hovering = false;\n\n    const onMove = (e) => {\n      hovering = true;\n      const nx = (e.clientX / window.innerWidth) * 2 - 1;\n      const ny = (e.clientY / window.innerHeight) * 2 - 1;\n      aim.y = 0.55 + nx * 0.95;\n      aim.x = -0.22 + ny * 0.6;\n    };\n    const onLeave = () => { hovering = false; aim.x = -0.22; aim.y = 0.55; };\n    window.addEventListener('mousemove', onMove);\n    window.addEventListener('mouseleave', onLeave);\n    window.addEventListener('blur', onLeave);\n    this.detachDrag = () => {\n      window.removeEventListener('mousemove', onMove);\n      window.removeEventListener('mouseleave', onLeave);\n      window.removeEventListener('blur', onLeave);\n    };\n\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const clock = new THREE.Clock();\n    const loop = () => {\n      const t = clock.getElapsedTime();\n      const drift = reduce ? 0 : Math.sin(t * 0.25) * 0.12;\n      rot.x += (aim.x - rot.x) * 0.06;\n      rot.y += (aim.y + (hovering ? 0 : drift) - rot.y) * 0.06;\n      group.rotation.x = rot.x;\n      group.rotation.y = rot.y;\n      if (!reduce) {\n        group.position.y = Math.sin(t * 0.6) * 0.1;\n        halo.rotation.x = -rot.x * 0.5 + t * 0.05;\n        halo.rotation.y = -rot.y * 0.4;\n        dust.rotation.y = t * 0.04;\n      }\n      renderer.render(scene, camera);\n      this.raf = requestAnimationFrame(loop);\n    };\n    loop();\n  }\n\n  // pinned statement: big word scales/fades and the line swaps with scroll\n  updateStatement() {\n    const sec = document.getElementById('statement');\n    const word = document.getElementById('stmt-word');\n    if (!sec || !word) return;\n    const r = sec.getBoundingClientRect();\n    const span = Math.max(1, sec.offsetHeight - window.innerHeight);\n    const p = Math.min(1, Math.max(0, -r.top / span));\n    const scale = 0.72 + p * 1.05;\n    const clip = Math.min(100, 8 + p * 130);\n    word.style.transform = 'scale(' + scale.toFixed(3) + ')';\n    word.style.letterSpacing = (-0.04 - p * 0.015).toFixed(4) + 'em';\n    word.style.backgroundImage = 'linear-gradient(90deg, #fff6ec 0%, #fff6ec ' + clip + '%, rgba(243,236,224,0.16) ' + Math.min(100, clip + 14) + '%)';\n    word.style.webkitBackgroundClip = 'text';\n    word.style.backgroundClip = 'text';\n    word.style.color = 'transparent';\n    word.style.opacity = (p > 0.88 ? Math.max(0, 1 - (p - 0.88) / 0.12) : 1).toFixed(3);\n    const idx = p < 0.34 ? 0 : (p < 0.68 ? 1 : 2);\n    sec.querySelectorAll('.stmt-line').forEach(el => {\n      el.classList.toggle('on', Number(el.dataset.stmt) === idx);\n    });\n  }\n\n  // six <image-slot>s in the hero tray map onto the cube faces; poll their\n  // shadow <img> so a fresh drop becomes a texture without a reload\n  watchCubeFaces() {\n    const THREE = window.THREE;\n    const loader = new THREE.TextureLoader();\n    this.faceSrc = ['', '', '', '', '', ''];\n    const tick = () => {\n      for (let i = 0; i < 6; i++) {\n        const slot = document.getElementById('v3-cube-' + (i + 1));\n        const img = slot && slot.shadowRoot && slot.shadowRoot.querySelector('img');\n        const src = (img && img.getAttribute('src')) || '';\n        if (src === this.faceSrc[i]) continue;\n        this.faceSrc[i] = src;\n        const mat = this.cubeMats && this.cubeMats[i];\n        if (!mat) continue;\n        if (!src) {\n          if (mat.map) { mat.map.dispose(); mat.map = null; }\n          mat.color.setHex(0x2a2220);\n          mat.needsUpdate = true;\n        } else {\n          loader.load(src, (tex) => {\n            if (this.faceSrc[i] !== src) return;\n            if (mat.map) mat.map.dispose();\n            mat.map = tex;\n            mat.color.setHex(0xffffff);\n            mat.roughness = 0.55;\n            mat.metalness = 0.08;\n            mat.needsUpdate = true;\n          });\n        }\n      }\n      this.faceTimer = setTimeout(tick, 600);\n    };\n    tick();\n  }\n\n  observeReveals() {\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in-view'); });\n    }, { threshold: 0.14 });\n    document.querySelectorAll('.reveal').forEach(el => io.observe(el));\n    this.revealObserver = io;\n  }\n\n  componentDidUpdate() {\n    if (this.revealObserver) {\n      document.querySelectorAll('.reveal:not(.in-view)').forEach(el => this.revealObserver.observe(el));\n    }\n  }\n\n  toggleXp(i) {\n    this.setState(s => {\n      const xp = s.xp.slice();\n      xp[i] = !xp[i];\n      return { xp };\n    });\n  }\n\n  renderVals() {\n    const { nav, xp, work } = this.state;\n    const toggleWork = (i) => () => this.setState(s => {\n      const w = s.work.slice(); w[i] = !w[i]; return { work: w };\n    });\n    return {\n      drawerClass: nav ? 'open' : '',\n      toggleNav: () => this.setState(s => ({ nav: !s.nav })),\n      closeNav: () => this.setState({ nav: false }),\n      backToTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),\n      w0Open: work[0] ? 'true' : 'false',\n      w1Open: work[1] ? 'true' : 'false',\n      toggleW0: toggleWork(0),\n      toggleW1: toggleWork(1),\n      xp0Open: xp[0] ? 'true' : 'false',\n      xp1Open: xp[1] ? 'true' : 'false',\n      xp2Open: xp[2] ? 'true' : 'false',\n      toggleXp0: () => this.toggleXp(0),\n      toggleXp1: () => this.toggleXp(1),\n      toggleXp2: () => this.toggleXp(2)\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
